name: Deploy support-inbox functions

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy to run'
        required: true
        default: ''
      ref:
        description: 'Git ref to deploy (branch/SHA). Use the fix branch until it is merged.'
        required: true
        default: 'cursor/fix-admin-support-inbox-queue-bc18'
  # Allow deploy from this feature branch without merging to main first.
  # Touch scripts/trigger-support-inbox-deploy to re-run.
  push:
    branches:
      - cursor/fix-admin-support-inbox-queue-bc18
    paths:
      - 'scripts/trigger-support-inbox-deploy'
      - '.github/workflows/deploy-support-inbox.yml'

jobs:
  deploy:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        run: npm ci --omit=dev
        working-directory: functions

      - name: Require FIREBASE_TOKEN secret
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Missing GitHub Actions secret FIREBASE_TOKEN."
            echo "Create one with: firebase login:ci"
            echo "Then: Repo Settings → Secrets → Actions → New repository secret FIREBASE_TOKEN"
            exit 1
          fi

      - name: Deploy support-inbox functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: tpp-splendide
        run: |
          echo "Deploying SHA: $(git rev-parse HEAD)"
          npx --yes firebase-tools@13 deploy \
            --only functions:createSupportTicket,functions:reopenTicket,functions:addTicketToWorkQueue,functions:submitFeedback,functions:dailySupportInboxBacklogScan,functions:runSupportInboxBacklogScanNow \
            --project "$FIREBASE_PROJECT" \
            --force \
            --non-interactive \
            --token "$FIREBASE_TOKEN"

      - name: Verify production HTTP endpoints
        run: |
          chmod +x ./scripts/verify-support-inbox-deploy.sh
          ./scripts/verify-support-inbox-deploy.sh

      - name: Confirm functions list
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: tpp-splendide
        run: |
          npx --yes firebase-tools@13 functions:list \
            --project "$FIREBASE_PROJECT" \
            --non-interactive \
            --token "$FIREBASE_TOKEN" \
            | tee /tmp/fn-list.txt
          for name in createSupportTicket reopenTicket addTicketToWorkQueue submitFeedback dailySupportInboxBacklogScan runSupportInboxBacklogScanNow; do
            grep -qi "$name" /tmp/fn-list.txt || { echo "MISSING: $name"; exit 1; }
          done
          echo "All 6 support-inbox functions present."
